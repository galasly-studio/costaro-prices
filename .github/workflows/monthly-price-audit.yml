name: COSTARO Monthly Market Check

# Safe scheduled research. It deliberately NEVER updates prices.json.
# Add a separate, fully tested publication workflow after Flutter client
# compatibility and live-source coverage are verified.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/monthly-price-audit.yml'
      - 'scripts/plan_verified_material_updates.py'
      - 'scripts/build_material_tier_review.py'
      - 'scripts/prepare_verified_catalog_release.py'
      - 'scripts/audit_consumption_alignment.py'
      - 'scripts/build_material_candidate_dossiers.py'
      - 'tests/test_build_material_candidate_dossiers.py'
      - 'scripts/build_material_quality_dossiers.py'
      - 'tests/test_build_material_quality_dossiers.py'
      - 'scripts/audit_material_source_traceability.py'
      - 'tests/test_material_source_traceability.py'
      - 'scripts/build_quality_first_review.py'
      - 'tests/test_quality_first_review.py'
      - 'scripts/build_material_family_criteria.py'
      - 'tests/test_material_family_criteria.py'
      - 'scripts/build_priority_material_criteria.py'
      - 'tests/test_priority_material_criteria.py'
      - 'scripts/build_manufacturer_evidence_leads.py'
      - 'tests/test_manufacturer_evidence_leads.py'
      - 'scripts/build_manufacturer_review_queue.py'
      - 'scripts/build_retail_identity_crosscheck.py'
      - 'scripts/build_product_provenance_review.py'
      - 'scripts/check_live_sku_listing.py'
      - 'scripts/audit_priority_sources_batch.py'
      - 'scripts/build_complete_material_criteria.py'
      - 'scripts/build_market_decision_dashboard.py'
      - 'scripts/build_bulk_sku_tier_evidence.py'
      - 'scripts/build_official_manufacturer_batch.py'
      - 'tests/test_official_manufacturer_batch.py'
      - 'scripts/build_official_content_evidence.py'
      - 'tests/test_official_content_evidence.py'
      - 'scripts/build_material_decision_matrix.py'
      - 'tests/test_material_decision_matrix.py'
      - 'scripts/build_room_use_guard_review.py'
      - 'tests/test_room_use_guard_review.py'
      - 'scripts/build_manual_sku_pilot_dossiers.py'
      - 'tests/test_manual_sku_pilot_dossiers.py'
      - 'tests/test_bulk_sku_tier_evidence.py'
      - 'tests/test_market_decision_dashboard.py'
      - 'tests/test_build_complete_material_criteria.py'
      - 'tests/test_audit_priority_sources_batch.py'
      - 'tests/test_live_sku_listing.py'
      - 'tests/test_product_provenance_review.py'
      - 'tests/test_retail_identity_crosscheck.py'
      - 'tests/test_manufacturer_review_queue.py'
      - 'scripts/check_labor_source_health.py'
      - 'scripts/labor_network_retry.py'
      - 'scripts/collect_live_labor_quotes.py'
      - 'scripts/audit_live_labor_drift.py'
      - 'scripts/build_labor_review_queue.py'
      - 'scripts/build_labor_evidence_dossiers.py'
      - 'scripts/collect_prices.py'
      - 'labor_live_match_rules.json'
      - 'labor_manual_research_leads.json'
      - 'material_consumption_evidence.json'
      - 'tests/test_build_material_tier_review.py'
      - 'tests/test_prepare_verified_catalog_release.py'
      - 'tests/test_safe_publisher_wiring.py'
      - 'tests/test_collect_price_source_health.py'
      - 'tests/test_verified_structured_sku.py'
      - 'tests/test_obramag_primary_card.py'
      - 'tests/test_audit_consumption_alignment.py'
      - 'tests/test_check_labor_source_health.py'
      - 'tests/test_labor_network_retry.py'
      - 'tests/test_collect_live_labor_quotes.py'
      - 'tests/test_labor_stage26_sources.py'
      - 'tests/test_audit_live_labor_drift.py'
      - 'tests/test_build_labor_review_queue.py'
      - 'tests/test_build_labor_evidence_dossiers.py'
      - 'labor_market_sources.json'
  schedule:
    - cron: '37 5 2 * *'

permissions:
  contents: read

concurrency:
  group: costaro-monthly-price-check
  cancel-in-progress: false

jobs:
  monthly-check:
    name: Inspect material and labor price evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Use a managed Python for monthly research
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pinned, text-only PDF research extractor
        run: python3 -m pip install --disable-pip-version-check pypdf==5.9.0

      - name: Validate Python scripts
        run: |
          python3 -m py_compile scripts/collect_prices.py
          python3 -m py_compile scripts/audit_prices.py
          python3 -m py_compile scripts/audit_labor_prices.py
          python3 -m py_compile scripts/check_labor_source_health.py
          python3 -m py_compile scripts/labor_network_retry.py
          python3 -m py_compile scripts/collect_live_labor_quotes.py
          python3 -m py_compile scripts/audit_live_labor_drift.py
          python3 -m py_compile scripts/build_labor_review_queue.py
          python3 -m py_compile scripts/build_labor_evidence_dossiers.py
          python3 -m py_compile scripts/plan_verified_material_updates.py
          python3 -m py_compile scripts/build_material_tier_review.py
          python3 -m py_compile scripts/audit_material_pack_alignment.py
          python3 -m py_compile scripts/prepare_verified_catalog_release.py
          python3 -m py_compile scripts/audit_consumption_alignment.py
          python3 -m py_compile scripts/build_material_candidate_dossiers.py
          python3 -m py_compile scripts/build_material_quality_dossiers.py
          python3 -m py_compile scripts/audit_material_source_traceability.py
          python3 -m py_compile scripts/build_quality_first_review.py
          python3 -m py_compile scripts/build_material_family_criteria.py
          python3 -m py_compile scripts/build_priority_material_criteria.py
          python3 -m py_compile scripts/build_manufacturer_evidence_leads.py
          python3 -m py_compile scripts/build_manufacturer_review_queue.py
          python3 -m py_compile scripts/build_retail_identity_crosscheck.py
          python3 -m py_compile scripts/build_product_provenance_review.py
          python3 -m py_compile scripts/check_live_sku_listing.py
          python3 -m py_compile scripts/audit_priority_sources_batch.py
          python3 -m py_compile scripts/build_complete_material_criteria.py
          python3 -m py_compile scripts/build_market_decision_dashboard.py
          python3 -m py_compile scripts/build_bulk_sku_tier_evidence.py
          python3 -m py_compile scripts/build_official_content_evidence.py
          python3 -m py_compile scripts/build_material_decision_matrix.py
          python3 -m py_compile scripts/build_room_use_guard_review.py
          python3 -m py_compile scripts/build_manual_sku_pilot_dossiers.py

      - name: Run labor audit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check Flutter application catalog compatibility
        run: python3 scripts/validate_app_catalog.py --catalog prices.json --baseline app_embedded_baseline.json

      - name: Collect live material observations
        run: python3 scripts/collect_prices.py

      - name: Audit material observations
        run: python3 scripts/audit_prices.py

      - name: Audit catalog pack and unit alignment (read-only)
        run: python3 scripts/audit_material_pack_alignment.py --market-audit price_audit_report.json

      - name: Audit labor sources and 37 work rates
        run: python3 scripts/audit_labor_prices.py

      - name: Check labor source availability without verifying or publishing labor prices
        run: python3 scripts/check_labor_source_health.py

      - name: Extract precisely matched labor quotes for manual research only
        run: python3 scripts/collect_live_labor_quotes.py

      - name: Screen preliminary labor price drift without updating any tier
        run: python3 scripts/audit_live_labor_drift.py

      - name: Prepare complete human labor research queue without price changes
        run: python3 scripts/build_labor_review_queue.py

      - name: Build 38 research-only labor evidence dossiers
        run: python3 scripts/build_labor_evidence_dossiers.py

      - name: Validate labor dossier summary and list top manual priorities
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path('labor_evidence_dossiers.json').read_text(encoding='utf-8')
          )
          summary = report['summary']

          assert report['status'] == 'manual_evidence_review_only'
          assert summary['workTypesReviewed'] == 38
          assert summary['workTypesWithExactMappings'] == 35
          assert summary['workTypesWithoutExactMappings'] == 3
          assert summary['technologySpecificManualLeads'] == 5
          assert summary['sourceObservations'] == 53
          assert summary['publicationReadyLaborRates'] == 0

          assert report['publishedPricesChanged'] is False
          assert report['flutterCalculationsChanged'] is False
          assert report['automaticLaborPublicationEnabled'] is False

          assert all(
              not item['approvedForPublication']
              and not item['priceDateVerified']
              for item in report['dossiers']
          )

          with open(
              os.environ['GITHUB_STEP_SUMMARY'],
              'a',
              encoding='utf-8',
          ) as output:
              output.write(
                  '### Досье проверки 38 расценок'
                  + chr(10) * 2
              )

              output.write(
                  '38 работ проверяются вручную. '
                  '53 исследовательские строки; '
                  '3 работы не имеют точного сопоставления; '
                  '5 подсказок не являются ценами. '
                  'Подтверждено для публикации: **0**.'
                  + chr(10) * 2
              )

              output.write(
                  '| Приоритет | Работа | Причина | Строк |'
                  + chr(10)
              )

              output.write(
                  '|---:|---|---|---:|'
                  + chr(10)
              )

              for item in report['dossiers'][:10]:
                  output.write(
                      f"| {item['priority']} | "
                      f"{item['workKey']} | "
                      f"{item['reviewReasonRU']} | "
                      f"{len(item['evidenceRows'])} |"
                      + chr(10)
                  )

              output.write(
                  chr(10)
                  + 'Полный отчёт: Artifact '
                  'labor_evidence_dossiers_RU.md. '
                  'Действующие цены не изменены.'
                  + chr(10)
              )
          PY

      - name: Plan only strongly verified material changes (read-only)
        run: python3 scripts/plan_verified_material_updates.py

      - name: Prepare budget standard premium manual review (read-only)
        run: python3 scripts/build_material_tier_review.py

      - name: Compare manufacturer consumption with preliminary app norms (read-only)
        run: python3 scripts/audit_consumption_alignment.py

      - name: Build six material research dossiers (read-only)
        run: python3 scripts/build_material_candidate_dossiers.py

      - name: Compare three manufacturer quality dossiers (read-only)
        run: python3 scripts/build_material_quality_dossiers.py

      - name: Audit material source traceability (read-only)
        run: python3 scripts/audit_material_source_traceability.py

      - name: Review quality-first material classification (read-only)
        run: python3 scripts/build_quality_first_review.py

      - name: Build eight material family quality criteria (read-only)
        run: python3 scripts/build_material_family_criteria.py

      - name: Build priority material evidence criteria (read-only)
        run: python3 scripts/build_priority_material_criteria.py

      - name: Build guarded manufacturer evidence leads (read-only)
        run: python3 scripts/build_manufacturer_evidence_leads.py

      - name: Build guarded manufacturer manual evidence queue (read-only)
        run: python3 scripts/build_manufacturer_review_queue.py

      - name: Cross-check Moldova retail identities (read-only)
        run: python3 scripts/build_retail_identity_crosscheck.py

      - name: Review manufacturer and retailer provenance (read-only)
        run: python3 scripts/build_product_provenance_review.py

      - name: Check one exact Moldova SKU listing live (read-only)
        run: python3 scripts/check_live_sku_listing.py

      - name: Batch-audit priority manufacturer sources and all material families (read-only)
        run: python3 scripts/audit_priority_sources_batch.py
      - name: Define criteria for all 41 material positions (read-only)
        run: python3 scripts/build_complete_material_criteria.py
      - name: Evaluate guarded publication readiness (read-only)
        run: python3 scripts/prepare_verified_catalog_release.py

      - name: Build joint material and labor market decision dashboard (read-only)
        run: python3 scripts/build_market_decision_dashboard.py

      - name: Assemble exact retail SKU and technical quality evidence gates (read-only)
        run: python3 scripts/build_bulk_sku_tier_evidence.py

      - name: Summarize without changing published catalog
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('prices.json').read_text(encoding='utf-8'))
          materials = json.loads(Path('price_audit_report.json').read_text(encoding='utf-8'))
          labor = json.loads(Path('labor_audit_report.json').read_text(encoding='utf-8'))
          labor_health = json.loads(Path('labor_source_health.json').read_text(encoding='utf-8'))
          live_labor = json.loads(Path('live_labor_quotes.json').read_text(encoding='utf-8'))
          live_rules = json.loads(Path('labor_live_match_rules.json').read_text(encoding='utf-8'))
          labor_drift = json.loads(Path('labor_drift_review.json').read_text(encoding='utf-8'))
          labor_queue = json.loads(Path('labor_manual_review_queue.json').read_text(encoding='utf-8'))
          manual_leads = json.loads(Path('labor_manual_research_leads.json').read_text(encoding='utf-8'))
          planned = json.loads(Path('material_update_proposals.json').read_text(encoding='utf-8'))
          tier_review = json.loads(Path('material_tier_review.json').read_text(encoding='utf-8'))
          packs = json.loads(Path('material_pack_alignment_report.json').read_text(encoding='utf-8'))
          readiness = json.loads(Path('verified_release_readiness.json').read_text(encoding='utf-8'))
          consumption = json.loads(Path('consumption_alignment_report.json').read_text(encoding='utf-8'))
          observed = json.loads(Path('price_observations.json').read_text(encoding='utf-8'))
          store_health = observed.get('sourceHealth', [])
          individual_observations = [row for product in observed['materials']
                                     for row in product['observations']]
          strongly_identified = sum(
              row['status'] == 'candidate' and row['extractionMethod'] in
              ('product_microdata', 'product_structured_sku')
              for row in individual_observations)
          research_only = sum(
              row['status'] == 'candidate' and row['extractionMethod'] not in
              ('product_microdata', 'product_structured_sku')
              for row in individual_observations)
          assert store_health, 'Retail source diagnostics missing'
          assert sum(item['total'] for item in store_health) == sum(
              len(item['sources']) for item in json.loads(
                  Path('price_sources.json').read_text(encoding='utf-8'))['materials'])

          assert catalog['schemaVersion'] == 1
          assert catalog['country'] == 'MD' and catalog['currency'] == 'MDL'
          assert len(catalog['laborPrices']) == 37
          assert len(catalog['materialPrices']) == 41
          status = catalog['status']
          enabled = catalog['automaticUpdatesEnabled']
          assert ((status == 'draft' and enabled is False)
                  or (status == 'published' and enabled is True))
          assert labor['ok'] is True
          assert labor_health['status'] == 'research_only'
          assert labor_health['summary']['catalogLaborRates'] == 37
          assert labor_health['summary']['laborRatesLivePriceVerified'] == 0
          assert labor_health['publishedPricesChanged'] is False
          assert labor_health['flutterCalculationsChanged'] is False
          assert labor_health['automaticLaborPublicationEnabled'] is False
          assert live_labor['status'] == 'technical_research_only'
          assert live_rules['publicationAllowed'] is False
          assert live_labor['summary']['mappedSourceWorkPairs'] == len(live_rules['rules']) == 53
          assert live_labor['summary']['workTypesInPilot'] == len({r['workKey'] for r in live_rules['rules']}) == 35
          assert live_labor['summary']['workTypesMapped'] == live_labor['summary']['workTypesInPilot']
          assert live_labor['summary']['catalogLaborRates'] == 37
          assert live_labor['summary']['catalogWorkTypesWithResearchQuotes'] + live_labor['summary']['catalogWorkTypesWithoutResearchQuotes'] == 37
          assert live_labor['summary']['publicationReadyLaborRates'] == 0
          assert live_labor['publishedPricesChanged'] is False
          assert live_labor['flutterCalculationsChanged'] is False
          assert live_labor['automaticLaborPublicationEnabled'] is False
          assert all(not q['approvedForPublication'] for q in live_labor['observations'])
          assert labor_drift['status'] == 'technical_research_only'
          assert labor_drift['summary']['catalogLaborRates'] == 37
          assert labor_drift['summary']['laborRatesReviewed'] == 38
          assert labor_drift['summary']['rejectedUnitRows'] == live_labor['summary']['quoteRowsRejectedByUnit']
          assert labor_drift['summary']['approvedForPublication'] == 0
          assert labor_drift['publishedPricesChanged'] is False
          assert labor_drift['flutterCalculationsChanged'] is False
          assert labor_drift['automaticLaborPublicationEnabled'] is False
          assert all(not q['approvedForPublication'] and not q['priceDateVerified']
                     for q in labor_drift['workReview'])
          assert labor_queue['status'] == 'manual_research_only'
          assert manual_leads['researchOnly'] is True
          assert manual_leads['publicationAllowed'] is False
          assert labor_queue['summary']['workTypesReviewed'] == 38
          assert labor_queue['summary']['workTypesWithExactMappings'] == 35
          assert labor_queue['summary']['workTypesWithoutExactMappings'] == 3
          assert labor_queue['summary']['manualLeadsForUnmappedWork'] == 5
          assert labor_queue['summary']['publicationReadyLaborRates'] == 0
          assert labor_queue['publishedPricesChanged'] is False
          assert labor_queue['flutterCalculationsChanged'] is False
          assert labor_queue['automaticLaborPublicationEnabled'] is False
          assert all(not r['approvedForPublication'] and not r['priceDateVerified']
                     for r in labor_queue['workReview'])
          assert consumption['status'] == 'technical_research_only'
          assert consumption['publishedPricesChanged'] is False
          assert consumption['flutterCalculationsChanged'] is False
          assert consumption['automaticTierApprovalEnabled'] is False
          assert consumption['summary']['reviewedProducts'] == 6
          assert consumption['summary']['paintCandidatesDryRoomOnly'] == 1
          assert consumption['summary']['paintCandidatesHumidRoomCapable'] == 2
          assert all(not item['approvedForPublication'] for item in consumption['products'])

          material_summary = materials['summary']
          output = [
              '=== COSTARO MONTHLY MARKET CHECK ===',
              'Market: Moldova, MDL',
              f"Material catalog positions: {material_summary['catalogMaterials']}",
              f"Materials monitored: {material_summary['materialsWithMonitoring']}",
              f"Materials ready for comparison: {material_summary['materialsReadyForComparison']}",
              f"Physical pack checks: {packs['summary']['productTierChecks']}",
              f"Exactly aligned retail packs: {packs['summary']['checksByStatus']['exact']}",
              f"Catalog tier slots with exact retail pack options: {packs['summary']['catalogTierSlotsWithExactTwoShopMetadata']} / 123",
              f"Catalog tier slots with exact packs and comparable live prices: {packs['summary']['catalogTierSlotsWithLiveComparableExactPacks']} / 123",
              f"Wrong retail pack sizes: {packs['summary']['checksByStatus']['different_pack']}",
              f"Pack-to-unit conversions requiring review: {packs['summary']['checksByStatus']['conversion_review']}",
              f"Work rates: {labor['laborCount']}",
              f"Work rates ready for comparison: {labor['readyCount']}",
              f"Work rates requiring review: {labor['needsReviewCount']}",
              f"Labor price reference pages checked: {labor_health['summary']['uniqueUrlsConfiguredAndCurrent']}",
              f"Accessible labor price pages (not rate-verified): {labor_health['summary']['uniqueUrlsReachable']}",
              f"Labor rates with no current reference: {labor_health['summary']['laborRatesWithNoCurrentReferences']}",
              f"Labor rates with only one independent domain: {labor_health['summary']['laborRatesWithOneCurrentIndependentDomain']}",
              f"Labor rates with at least two independent domains: {labor_health['summary']['laborRatesWithAtLeastTwoCurrentIndependentDomains']}",
              f"Labor prices actually reverified live: {labor_health['summary']['laborRatesLivePriceVerified']}",
              f"Live labor quote row matches (research only): {live_labor['summary']['quoteRowsExtracted']} / {len(live_rules['rules'])}",
              f"Catalog labor keys with research quotes: {live_labor['summary']['catalogWorkTypesWithResearchQuotes']} / 37",
              f"Rejected source units (not comparable): {live_labor['summary']['quoteRowsRejectedByUnit']}",
              f"Labor quotes needing work-scope review: {live_labor['summary']['quotesWithScopeReviewRequired']}",
              f"Labor work types with two aligned bounded sources (not approved): {live_labor['summary']['workTypesWithTwoBoundedAlignedSourcesForComparison']}",
              f"Labor standard rates outside provisional 20-percent screening band: {labor_drift['summary']['outsidePreliminaryBandManualReview']}",
              f"Labor rates without two comparable independent sources: {labor_drift['summary']['insufficientIndependentSources'] + labor_drift['summary']['notComparable']}",
              f"Labor tasks in human research queue: {labor_queue['summary']['workTypesReviewed']}",
              f"Work types without exact machine-readable mappings: {labor_queue['summary']['workTypesWithoutExactMappings']}",
              f"Technology-specific leads requiring manual checks: {labor_queue['summary']['manualLeadsForUnmappedWork']}",
              f"Start putty: {labor['startPuttyMarketStatus']}",
              f"Catalog publication status: {status}",
              f"Strict material update proposals (not published): {planned['proposedCount']}",
              f"Tier product candidates for human review: {tier_review['summary']['reviewCandidates']}",
              f"Complete three-tier sets needing human review: {tier_review['summary']['materialsWithCompleteThreeTierCandidateSet']}",
              f"Automatic proposal policy enabled: {planned['policyEnabled']}",
              f"Guarded release readiness: {readiness['status']}",
              f"Release reasons held: {', '.join(readiness['holdReasons']) or 'none'}",
              f"Retail stores monitored: {len(store_health)}",
              f"Successful retail observations: {sum(row['candidate'] for row in store_health)} / {sum(row['total'] for row in store_health)}",
              f"Strict SKU and main-product verified prices: {strongly_identified}",
              f"Research-only retailer prices (identity not fully verified): {research_only}",
              f"Manufacturer consumption candidates reviewed: {consumption['summary']['reviewedProducts']}",
              f"Preliminary consumption-compatible candidates (not approved): {consumption['summary']['preliminaryConsumptionCompatible']}",
              f"Consumption mismatches or wide ranges requiring review: {consumption['summary']['consumptionReviewRequired']}",
              f"Paint products restricted to dry rooms (not universal): {consumption['summary']['paintCandidatesDryRoomOnly']}",
              f"Paint products stated as suitable for humid rooms (not approved): {consumption['summary']['paintCandidatesHumidRoomCapable']}",
              'This monthly check does not publish price changes.',
              'Current prices were preserved.',
              '',
              'NOTE: comparison-ready does not mean verified for publication.',
              'Live materials, preliminary labor quote matches and stored labor benchmarks are separate evidence classes.',
              'Never derive new tier prices from missing or stale evidence.',
          ]
          print('\n'.join(output))
          Path('monthly_price_summary.txt').write_text('\n'.join(output) + '\n', encoding='utf-8')
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## COSTARO — ежемесячная проверка цен (MDL)\n\n')
              summary.write('```text\n' + '\n'.join(output) + '\n```\n\n')
              summary.write('Данные видны здесь, без скачивания Artifacts. '
                            'До отдельного подтверждения публикация запрещена.\n')
              summary.write('\n**Проверка артикула:** надёжные наблюдения привязаны '
                            'к главному заголовку карточки, точному SKU/MPN, URL товара '
                            'и цене в MDL. Остальные цены остаются исследовательскими; '
                            'даже надёжные наблюдения не означают утверждённый '
                            'уровень бюджет/стандарт/премиум.\n')
              summary.write('\n### Доступность источников стоимости работ\n\n')
              sh = labor_health['summary']
              summary.write(
                  f"Проверено URL: **{sh['uniqueUrlsConfiguredAndCurrent']}**, "
                  f"доступных HTML-страниц: **{sh['uniqueUrlsReachable']}**, "
                  f"страниц с отказом/блокировкой: "
                  f"**{sh['uniqueUrlsBlockedOrUnavailable']}**, "
                  f"пропущено после ограничения доступа: **{sh['uniqueUrlsSkipped']}**.\n\n"
              )
              summary.write('| Состояние источников | Работ |\n|---|---:|\n')
              summary.write(f"| Нет актуальных справочных источников | {sh['laborRatesWithNoCurrentReferences']} |\n")
              summary.write(f"| Один независимый источник | {sh['laborRatesWithOneCurrentIndependentDomain']} |\n")
              summary.write(f"| Два и более независимых источника | {sh['laborRatesWithAtLeastTwoCurrentIndependentDomains']} |\n")
              summary.write('\n**Важно:** доступность страницы НЕ подтверждает цену конкретной '
                            'работы, единицу измерения, объём работ и дату изменения '
                            'расценки. Подтверждено новых актуальных цен работ: **0**. '
                            'Текущие расценки не изменены; автоматическая публикация '
                            'отключена. Сохранённые ранее ценовые диапазоны — лишь '
                            'справочные данные.\n')
              summary.write('\n### Поиск точных строк с расценками работ — исследование\n\n')
              lq = live_labor['summary']
              summary.write(
                  f"Проверено соответствий «работа × сайт»: **{lq['mappedSourceWorkPairs']}**; "
                  f"строк с точным названием и единицей: **{lq['quoteRowsExtracted']}**; "
                  f"несовпадений условий работы: **{lq['quotesWithScopeReviewRequired']}**. "
                  f"Подтверждено для публикации: **0**.\n\n"
              )
              summary.write('| Работа COSTARO | Сайт | Найденная цена, MDL | Сопоставимость |\n')
              summary.write('|---|---|---:|---|\n')
              names = {
                  'removeWallpaperWork': 'Снятие обоев',
                  'removePaintWork': 'Удаление краски',
                  'removeTileWork': 'Демонтаж плитки на стенах',
                  'plasterWork': 'Штукатурка стен',
                  'puttyWork': 'Финишная шпаклёвка стен',
                  'primerWork': 'Грунтовка стен',
                  'wallpaperWork': 'Поклейка обоев',
                  'wallPaintWork': 'Покраска стен (2 слоя)',
                  'wallTileWork': 'Укладка настенной плитки',
                  'decorativeWork': 'Декоративная штукатурка стен',
                  'floorRemoveSoftCoverWork': 'Демонтаж мягкого покрытия пола',
                  'floorRemoveTileWork': 'Демонтаж плитки пола',
                  'floorScreedWork': 'Стяжка пола',
                  'selfLevelingFloorWork': 'Наливной пол',
                  'floorPrimerWork': 'Грунтовка пола',
                  'floorWaterproofingWork': 'Гидроизоляция пола',
                  'laminateWork': 'Укладка ламината',
                  'linoleumWork': 'Укладка линолеума',
                  'floorTileWork': 'Укладка напольной плитки',
                  'skirtingWork': 'Монтаж плинтуса',
                  'ceilingPaintWork': 'Покраска потолка',
                  'ceilingPuttyWork': 'Шпаклёвка потолка',
                  'ceilingPrimerWork': 'Грунтовка потолка',
                  'drywallCeilingWork': 'Гипсокартонный потолок',
                  'stretchCeilingTurnkey': 'Натяжной потолок под ключ',
                  'electricalDeviceInstallWork': 'Установка розеток и выключателей',
                  'electricalSubboxInstallWork': 'Монтаж подрозетника',
                  'electricalSubboxHoleWork': 'Отверстие под подрозетник',
                  'electricalCableLayWork': 'Прокладка кабеля',
                  'electricalLightInstallWork': 'Монтаж светильников',
                  'electricalDeviceRemovalWork': 'Демонтаж розеток и выключателей',
                  'electricalLightRemovalWork': 'Демонтаж светильников',
                  'plumbingWaterPipeWork': 'Прокладка труб водоснабжения',
                  'plumbingSewerPipeWork': 'Прокладка канализационных труб',
                  'startPuttyWork': 'Стартовая шпаклёвка стен',
              }
              for q in live_labor['observations']:
                  if q['status'] != 'research_quote':
                      value = '— (' + q['reason'] + ')'
                  elif q['priceKind'] == 'lower_bound':
                      value = 'от ' + str(q['minimumMDL'])
                  elif q['priceKind'] == 'fixed_price':
                      value = str(q['minimumMDL'])
                  else:
                      value = str(q['minimumMDL']) + '–' + str(q['maximumMDL'])
                  scope_note = ('Предварительное соответствие'
                                if q['scopeStatus'] == 'preliminarily_aligned'
                                else 'Условия требуют проверки')
                  if q['status'] == 'rejected':
                      scope_note = 'ОТКЛОНЕНО: ' + q['reason']
                  summary.write(f"| {names[q['workKey']]} | {q['source']} | {value} | {scope_note} |\n")
              summary.write('\n**Принцип безопасности:** найденная цена — ещё не подтверждённый '
                            'тариф. Указания «от» остаются нижней границей. '
                            'Нельзя сравнивать цену за один слой с ценой COSTARO '
                            'за два слоя, объединять стартовую и финишную шпаклёвку '
                            'или скрывать толщину штукатурки. Даты публикации '
                            'конкретных строк автоматически не подтверждаются. '
                            'Бюджет/стандарт/премиум НЕ назначаются.\n')
              summary.write('\n### Контроль отклонений цен работ — только для ручного анализа\n\n')
              ds = labor_drift['summary']
              summary.write(
                  f"Проверены **{ds['catalogLaborRates']}** работ и отдельная стартовая шпаклёвка. "
                  f"Достаточно двух предварительно сопоставимых независимых сайтов: "
                  f"**{ds['insidePreliminaryBandNotVerified'] + ds['outsidePreliminaryBandManualReview']}**. "
                  f"За условными границами (±20%): **{ds['outsidePreliminaryBandManualReview']}**; "
                  f"один источник: **{ds['insufficientIndependentSources']}**; "
                  f"нет сопоставимой пары: **{ds['notComparable']}**. "
                  f"Отклонено строк из-за единицы измерения: **{ds['rejectedUnitRows']}**.\n\n"
              )
              flagged = [r for r in labor_drift['workReview']
                         if r['screeningStatus'] == 'outside_preliminary_band_manual_review']
              if flagged:
                  summary.write('| Требует ручной проверки | Стандарт COSTARO, MDL | Исследовательский диапазон, MDL |\n')
                  summary.write('|---|---:|---:|\n')
                  for r in flagged:
                      band = r['marketBandResearchOnly']
                      summary.write(f"| {names.get(r['workKey'], r['workKey'])} | "
                                    f"{r['catalogStandardMDL']} | "
                                    f"{band['provisionalMinimumMDL']}–{band['provisionalMaximumMDL']} |\n")
              else:
                  summary.write('По двум предварительно сопоставимым сайтам отклонений за '
                                'условной границей не обнаружено. Это НЕ подтверждение тарифов.\n')
              missing = [r['workKey'] for r in labor_drift['workReview']
                         if r['mappedPages'] == 0 and r['workKey'] != 'startPuttyWork']
              summary.write(f"\nБез настроенной точной строки: **{len(missing)}** работ: "
                            + ', '.join(f'`{key}`' for key in missing) + '.\n')
              summary.write('\n### Очередь проверки 38 расценок — без изменения цен\n\n')
              qsummary = labor_queue['summary']
              summary.write(f"Составлено задач: **{qsummary['workTypesReviewed']}**; "
                            f"точных настроенных соответствий: **{qsummary['workTypesWithExactMappings']}**; "
                            f"без точного соответствия: **{qsummary['workTypesWithoutExactMappings']}**. "
                            f"Исследовательских подсказок: **{qsummary['manualLeadsForUnmappedWork']}**. "
                            'Подтверждённых к публикации тарифов: **0**.\n\n')
              summary.write('| Приоритет | Работа | Причина | Следующее ручное действие |\n')
              summary.write('|---:|---|---|---|\n')
              for task in labor_queue['workReview']:
                  if task['priority'] <= 3:
                      summary.write(f"| {task['priority']} | `{task['workKey']}` | "
                                    f"{task['reviewGroup']} | {task['nextManualAction']} |\n")
              summary.write('\n**Внимание:** «снятие декоративной краски» не равно удалению '
                            'всякого декоративного покрытия; демонтаж паркета или подложки '
                            'не равен любой другой отделке пола; клеевой и замковый винил '
                            'требуют разных технологических условий. Эти ссылки — подсказки '
                            'для ручного поиска, а не автоматически проверенные цены.\n')
              summary.write('\n**Это сигнал для проверки, не рекомендация изменения цены.** '
                            'Даже два сайта не подтверждают дату конкретного тарифа, '
                            'совпадение технологии, толщины, числа слоёв и состава работ. '
                            'Границы ±20% используются лишь для сортировки задач. '
                            'Действующие цены и уровни бюджет/стандарт/премиум сохранены.\n')
              summary.write('\n### Сопоставление предварительного расхода с производителем\n\n')
              summary.write('Исследование 6 товаров: **без изменения формул и цен COSTARO**. '
                            'Нормы Flutter зафиксированы на 02.11.2026; перед релизом '
                            'их необходимо повторно проверить в исходном коде.\n\n')
              summary.write('| Товар | Расход, статус | Упаковок на 50 м²: COSTARO / диапазон | Применение | Решение |\n')
              summary.write('|---|---|---|---|---|\n')
              for item in consumption['products']:
                  package = item['examplePackages']
                  decision = ('Нельзя для всех комнат: проверка'
                              if item['requiresRoomUseReview'] else
                              'Требует проверки расхода'
                              if item['requiresConsumptionReview'] else
                              'Предварительно сопоставимо, не утверждено')
                  summary.write(
                      f"| `{item['id']}` | {item['status']} | "
                      f"{package['appPreliminary']} / "
                      f"{package['manufacturerMinimum']}–{package['manufacturerMaximum']} "
                      f"| {item['roomCoverageStatus']} | {decision} |\n")
              summary.write('\n**Sansiro и Meșterul Manole требуют проверки расхода.** '
                            'Euroton Eco — лишь кандидат для изучения, без настройки '
                            'сбора и без утверждения. Расход шпаклёвки потолка этим '
                            'аудитом не проверяется.\n')
              summary.write('\n**Ограничение по типу помещения:** Romanita только для '
                            'сухих комнат по документации производителя. В COSTARO '
                            'одна общая позиция интерьерной краски для всех типов комнат, '
                            'поэтому универсальная бюджетная привязка Romanita запрещена. '
                            'Euroton Lav и Sansiro производитель допускает для влажных '
                            'комнат, но их качество и пригодность к автоматическим ценовым '
                            'уровням всё ещё не утверждены.\n')
              summary.write('\n### Доступность магазинов — ошибки и методы получения цен\n\n')
              summary.write('| Магазин | Успешно | Всего | Причины отказов | Способ получения цены |\n')
              summary.write('|---|---:|---:|---|---|\n')
              for row in store_health:
                  errors = ', '.join(f'{key}: {n}' for key, n in row['errors'].items()) or '—'
                  methods = ', '.join(f'{key}: {n}' for key, n in row['methods'].items()) or '—'
                  summary.write(f"| {row['store']} | {row['candidate']} | {row['total']} | {errors} | {methods} |\n")
              summary.write('\nHTTP 403/429 означает ограничение доступа или частоты запросов. '
                            'После такого ответа повторные обращения к этому хосту '
                            'в данном запуске пропускаются.\n')
          PY

      - name: Assemble official manufacturer source batch (research only)
        run: python3 scripts/build_official_manufacturer_batch.py

      - name: Inspect official document content and model markers (read-only)
        run: python3 scripts/build_official_content_evidence.py

      - name: Build evidence and action matrix for all 41 material keys (read-only)
        run: python3 scripts/build_material_decision_matrix.py

      - name: Screen room-use restrictions and composite fastener pricing (read-only)
        run: python3 scripts/build_room_use_guard_review.py

      - name: Prepare five exact-SKU human approval pilots without publication
        run: python3 scripts/build_manual_sku_pilot_dossiers.py

      - name: Upload monthly audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: costaro-monthly-market-check
          path: |
            price_observations.json
            price_audit_report.json
            material_pack_alignment_report.json
            labor_audit_report.json
            labor_audit_summary.txt
            labor_source_health.json
            live_labor_quotes.json
            labor_drift_review.json
            labor_manual_review_queue.json
            labor_evidence_dossiers.json
            labor_evidence_dossiers_RU.md
            material_update_proposals.json
            material_tier_review.json
            material_tier_review_RU.md
            consumption_alignment_report.json
            consumption_alignment_RU.md
            material_candidate_dossiers.json
            material_candidate_dossiers_RU.md
            material_quality_dossiers.json
            material_quality_dossiers_RU.md
            material_source_traceability.json
            material_source_traceability_RU.md
            material_quality_first_review.json
            material_quality_first_review_RU.md
            material_family_criteria.json
            material_family_criteria_RU.md
            priority_material_criteria.json
            priority_material_criteria_RU.md
            manufacturer_evidence_leads.json
            manufacturer_evidence_leads_RU.md
            manufacturer_review_queue.json
            manufacturer_review_queue_RU.md
            retail_identity_crosscheck.json
            retail_identity_crosscheck_RU.md
            product_provenance_review.json
            product_provenance_review_RU.md
